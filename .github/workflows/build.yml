name: build
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Compile zygisk module
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Fetch frida-gadget (android arm64)
        run: |
          VER=$(curl -s https://api.github.com/repos/frida/frida/releases/latest | jq -r .tag_name)
          echo "frida $VER"
          curl -sL -o /tmp/gadget.so.xz \
            "https://github.com/frida/frida/releases/download/${VER}/frida-gadget-${VER}-android-arm64.so.xz"
          xz -d /tmp/gadget.so.xz
          cp /tmp/gadget.so files/libmfgo.so

      - name: Package Magisk module
        run: |
          rm -rf out && mkdir -p out/zygisk out/files
          cp build/libmodfgo-lite.so out/zygisk/arm64-v8a.so
          cp module.prop customize.sh out/
          cp -r META-INF out/
          cp files/libmfgo.so files/libmfgo.config.so files/modfgo.js out/files/
          cd out && zip -r9 ../zygisk_ModFGO-lite.zip . && cd ..
          ls -lh zygisk_ModFGO-lite.zip

      - uses: actions/upload-artifact@v4
        with:
          name: zygisk_ModFGO-lite
          path: zygisk_ModFGO-lite.zip
